{{block "recipe-edit" .}}
<h3 class="text-lg font-bold">Setup Recipe</h3>
<div>
  <form method="dialog" hx-post="/items/recipe">
    <input type="hidden" name="ParentItemID" value="{{.Id}}" />

    <div id="recipeItemsList">{{range .Page}} {{template "recipe-edit-row" .}} {{end}}</div>
    <div class="modal-action">
      <button class="btn mr-2" hx-get="/items/recipe/add" hx-trigger="click" hx-target="#recipeItemsList" hx-swap="beforeend">Add Item</button>
      <button class="btn btn-primary mr-2">Save</button>
    </div>
  </form>
</div>
{{end}} {{block "recipe-edit-row" .}}

 {{$SelectedItemId := .ItemId}} 
 <div class="flex" id="recipe_row_{{$SelectedItemId}}">
  <label class="gap-2 mt-5 mb-5 min-w-9/12 w-full flex-col">
    <select class="w-full select" placeholder="Item" name="ItemId" value="{{.ItemId}}">
     {{range .Items}}
      <option {{if eq .ID $SelectedItemId}} selected {{end}} value="{{.ID}}">{{.Name}}</option>
      {{end}}
    </select>
  </label>

  <label class="flex w-3/12 gap-2 items-center ml-2 mt-5 mb-5 input">
    <input type="number" class="grow w-full" placeholder="Amount" name="Amount" value="{{.Amount}}" />
  </label>

  <button class="btn btn-error ml-2 mt-5 mb-5" onclick="document.getElementById('recipe_row_{{$SelectedItemId}}').remove()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
      />
    </svg>
  </button>
</div>
{{end}}
