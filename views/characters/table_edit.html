{{block "table-edit" .}}
<h3 class="text-lg font-bold">{{if .Page.ID}} Edit {{else}} Create {{end}} Character</h3>
<div>
  <form method="dialog" hx-post="/characters">
    <input type="hidden" name="ID" value="{{.Page.ID}}" />
    <input type="hidden" name="ActiveItemId" value="{{.Page.ActiveItemId}}" />
    <input type="hidden" name="Notes" value="{{.Page.Notes}}" />
    <div class="grid lg:grid-cols-2 grid-cols-1 gap-4">
      <div>
        <div class="divider">Basic Info</div>
        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Character Name</span>
          </div>
          <input type="text" class="grow" placeholder="Name" name="Name" value="{{.Page.Name}}" />
        </label>

        <label class="flex gap-2 mt-5 mb-5 w-full flex-col">
          <div class="label">
            <span>Player</span>
          </div>
          <select
            class="w-full select"
            placeholder="User"
            name="UserId"
            value="{{.Page.UserId}}"
          >
            {{$SelectedUserId := .Page.UserId}} {{range .DropdownData.Users}}
            <option {{if eq .ID $SelectedUserId}} selected {{end}} value="{{.ID}}">{{.Username}}</option>
            {{end}}
          </select>
        </label>

        <label class="flex gap-2 mt-5 mb-5 w-full flex-col">
          <div class="label">
            <span>Class</span>
          </div>
          <select
            class="w-full select"
            placeholder="Class"
            name="Class"
            value="{{.Page.Class}}"
          >
            {{$SelectedClass := .Page.Class}} {{range .DropdownData.Classes}}
            <option {{if eq . $SelectedClass}} selected {{end}} value="{{.}}">{{.}}</option>
            {{end}}
          </select>
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Bio</span>
          </div>
          <input type="text" class="grow" placeholder="Bio" name="Bio" value="{{.Page.Bio}}" />
        </label>

        <div class="flex">
          <div class="avatar">
            <div class="h-20 w-20 rounded">
              {{if .Page.Image}}
              <img src="{{.Page.Image}}" />
              {{else}}
              <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.jpg" />
              {{end}}
            </div>
          </div>
          <label class="flex gap-2 items-center ml-5 mt-5 mb-5 w-full input">
            <div class="label">
              <span>Image Url</span>
            </div>

            <input type="text" class="grow" placeholder="Image Url" name="Image" value="{{.Page.Image}}" />
          </label>
        </div>
        <label class="flex gap-2 mt-5 mb-5 w-full flex-col">
          <div class="label">
            <span>Level</span>
          </div>
          <select
            class="w-full select"
            placeholder="Level"
            name="LevelId"
            value="{{.Page.LevelId}}"
          >
            {{$SelectedLevelId := .Page.LevelId}} {{range .DropdownData.Levels}}
            <option {{if eq .ID $SelectedLevelId}} selected {{end}} value="{{.ID}}">
              {{.Name}} - {{.ExperienceNeeded}}
            </option>
            {{end}}
          </select>
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Experience Points</span>
          </div>
          <input
            type="number"
            class="grow"
            placeholder="Experience Points"
            name="ExperiencePoints"
            value="{{.Page.ExperiencePoints}}"
          />
        </label>

        <label class="flex gap-2 mt-5 mb-5 w-full flex-col">
          <div class="label">
            <span>Combat Level</span>
          </div>
          <select
            class="w-full select"
            placeholder="Combat Level"
            name="CombatLevelId"
            value="{{.Page.CombatLevelId}}"
          >
            {{$SelectedCombatLevelId := .Page.CombatLevelId}} {{range .DropdownData.Levels}}
            <option {{if eq .ID $SelectedCombatLevelId}} selected {{end}} value="{{.ID}}">
              {{.Name}} - {{.ExperienceNeeded}}
            </option>
            {{end}}
          </select>
        </label>
        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Combat Experience Points</span>
          </div>
          <input
            type="number"
            class="grow"
            placeholder="Combat Experience Points"
            name="CombatExperiencePoints"
            value="{{.Page.CombatExperiencePoints}}"
          />
        </label>
      </div>

      <div>
        <div class="divider">Statistics</div>
        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Health</span>
          </div>

          <input type="number" class="grow" placeholder="Health" name="Health" value="{{.Page.Health}}" />
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Max Health</span>
          </div>

          <input
            type="number"
            class="grow"
            placeholder="Max Health"
            name="MaxHealth"
            value="{{.Page.MaxHealth}}"
          />
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Attack</span>
          </div>

          <input type="number" class="grow" placeholder="Attack" name="Attack" value="{{.Page.Attack}}" />
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Strength</span>
          </div>

          <input
            type="number"
            class="grow"
            placeholder="Strength"
            name="Strength"
            value="{{.Page.Strength}}"
          />
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Defence</span>
          </div>

          <input type="number" class="grow" placeholder="Defence" name="Defence" value="{{.Page.Defence}}" />
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Armour Rating</span>
          </div>

          <input
            type="number"
            class="grow"
            placeholder="Armour Rating"
            name="ArmourRating"
            value="{{.Page.ArmourRating}}"
          />
        </label>

        <div class="divider">Currencies</div>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Gold</span>
          </div>

          <input type="number" class="grow" placeholder="Gold" name="Gold" value="{{.Page.Gold}}" />
        </label>

        <label class="flex gap-2 items-center mt-5 mb-5 input">
          <div class="label">
            <span>Diamonds</span>
          </div>

          <input
            type="number"
            class="grow"
            placeholder="Diamonds"
            name="Diamonds"
            value="{{.Page.Diamonds}}"
          />
        </label>
      </div>
    </div>
    <div class="modal-action">
      <button class="mr-2 btn btn-primary">Save</button>
    </div>
  </form>
</div>
{{end}}
