{{block "table" .}}
<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Class</th>
      <th>Gold</th>
      <th>Diamonds</th>
      <th>Level</th>
      <th>User</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Page}} {{template "table-row" .}} {{end}}
  </tbody>
</table>
{{end}}
