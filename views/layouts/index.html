{{ block "index" .}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinity Initiative</title>
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <script src="/assets/js/htmx.min.js"></script>
  </head>
  <body>
    <div class="drawer lg:drawer-open h-screen">
      <input id="sidebar" type="checkbox" class="drawer-toggle peer" />
      <div class="drawer-content">
        <!-- Page content here -->
        <div class="navbar bg-primary text-primary-content">
          <div class="flex-none">
            <label
              for="sidebar"
              aria-label="open sidebar"
              class="btn btn-square btn-ghost"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                class="inline-block w-5 h-5 stroke-current"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                ></path>
              </svg>
            </label>
          </div>
          <button class="btn btn-ghost text-xl">Infinity Initiative</button>
        </div>

        <div class="main">
          <h1>Index</h1>
        </div>
      </div>
      <div
        class="drawer-side peer-checked:pointer-events-auto peer-checked:visible peer-checked:sticky peer-checked:w-auto"
      >
        <label for="sidebar" class="drawer-overlay"></label>
        <ul class="menu bg-base-200 text-base-content min-h-full w-80 p-4">
          <!-- Sidebar content here -->
          <li><a>Sidebar Item 1</a></li>
          <li><a>Sidebar Item 2</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
{{ end }}
