{{block "recipes" .}}
<div
  tabindex="0"
  class="collapse collapse-arrow collapse-open bg-neutral text-neutral-content shadow-xl"
>
  <input type="checkbox" />
  <div class="collapse-content">
    <ul class="menu bg-base-200 rounded-box gap-2">
      {{range .DropdownData.Items}}
        {{template "recipe_item" .}}
      {{end}}
    </ul>
  </div>
</div>
{{end}}
