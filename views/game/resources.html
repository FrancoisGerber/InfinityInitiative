{{block "resources" .}}
<div tabindex="0" class="collapse collapse-arrow bg-neutral text-neutral-content shadow-xl">
  <input
    type="checkbox"
    hx-post="/game/state/ResourceListState"
    hx-trigger="click"
    hx-swap="none"
    name="ResourceListState"
    {{if
    .DropdownData.GameState.ResourceListState}}
    checked
    {{end}}
  />
  <div class="collapse-title text-xl font-medium">Select a resource</div>
  <div class="collapse-content">
    <ul class="menu w-full gap-2 rounded-box">
      {{range .DropdownData.Items}} {{template "resource_item" .}} {{end}}
    </ul>
  </div>
</div>
{{end}}
