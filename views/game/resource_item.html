{{block "resource_item" .}}
<li>
  <a
    hx-trigger="click"
    hx-swap="none"
    hx-get="/game/action/{{.ID}}"
    class="{{if eq .ActiveItem.ID .ID}}active-neutral{{end}} flex flex-wrap items-center gap-2 bg-base-100 p-2"
  >
    <img class="w-10 shrink-0" src="{{.Image}}" />
    <span class="rounded bg-gray-700 p-1 whitespace-nowrap">Lv. {{.Level.Name}}</span>
    <span class="font-bold whitespace-nowrap">{{.Name}}</span>

    {{range .Recipes}}
    <span class="rounded bg-gray-700 p-1 whitespace-nowrap">{{.Amount}}x {{.Item.Name}}</span>
    {{end}}

    <span class="ml-auto rounded bg-gray-700 p-1 whitespace-nowrap">{{.ExperienceGained}} XP</span>
    <span class="rounded bg-gray-700 p-1 whitespace-nowrap">{{.RuntimeString}}</span>
  </a>
</li>
{{end}}
