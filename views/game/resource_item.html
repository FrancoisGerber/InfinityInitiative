{{block "resource_item" .}}
<li>
  <a
    hx-trigger="click"
    hx-swap="none"
    hx-get="/game/action/{{.ID}}"
    class="{{if eq .ActiveItem.ID .ID}}active-neutral{{end}} flex w-full flex-nowrap items-center gap-2 bg-base-100 px-2 py-1"
  >
    <img class="w-8 shrink-0" src="{{.Image}}" />
    <span class="chip">Lv. {{.Level.Name}}</span>
    <span class="text-sm font-bold whitespace-nowrap">{{.Name}}</span>

    <span class="ml-auto flex flex-wrap items-center gap-2">
      {{range .Recipes}}
      <span class="chip">{{.Amount}}x {{.Item.Name}}</span>
      {{end}}
      <span class="chip">{{.ExperienceGained}} XP</span>
      <span class="chip">{{.RuntimeString}}</span>
    </span>
  </a>
</li>
{{end}}
