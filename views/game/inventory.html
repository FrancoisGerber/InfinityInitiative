{{block "inventory" .}}
<div tabindex="0" class="collapse collapse-open collapse-arrow bg-neutral text-neutral-content shadow-xl">
  <input type="checkbox" />
  <div class="collapse-title text-xl font-medium">Storage {{len .DropdownData.Inventory}}/20</div>
  <div class="collapse-content">
    <div role="tablist" class="tabs tabs-lifted">
      <a role="tab" class="tab tab-active">
        <img src="/assets/img/inventory.png" class="py-1 px-2" />
      </a>
      <div role="tabpanel" class="tab-content bg-base-100 border-base-300 rounded-box p-6">
        <div class="grid lg:grid-cols-4 grid-cols-4 content-center gap-4">
          {{range .DropdownData.Inventory}}
          <div class="tooltip tooltip-top tooltip-primary" data-tip="{{.Item.Name}}">
            <div class="indicator rounded-box bg-neutral h-20 w-full content-center cursor-pointer">
              <span class="indicator-item indicator-start badge border-2 border-neutral-600">{{.Amount}}</span>
              <img src="{{.Item.Image}}" class="h-12 w-12 mx-auto my-auto hover" />
            </div>
          </div>
          {{end}}
        </div>
      </div>
      <a role="tab" class="tab">
        <img src="/assets/img/equipment.png" class="py-1 px-2" />
      </a>
      <div role="tabpanel" class="tab-content bg-base-100 border-base-300 rounded-box p-6">Content 2</div>
      <a role="tab" class="tab">
        <img src="/assets/img/quests.png" class="py-1 px-2" />
      </a>
      <div role="tabpanel" class="tab-content bg-base-100 border-base-300 rounded-box p-6">Content 3</div>
    </div>
  </div>
</div>
{{end}}
