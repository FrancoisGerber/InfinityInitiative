{{block "character-info" .}}
<div class="flex">
  <div class="avatar mr-3">
    <div class="w-24 rounded">
      {{if .Character.Image}}
      <img src="{{.Character.Image}}" alt="{{.Character.Name}}" />
      {{else if .Character.Class}}
      <img src="/assets/img/classes/{{.Character.Class}}.png" alt="{{.Character.Class}}" />
      {{else}}
      <img src="/assets/img/favicon.png" alt="" />
      {{end}}
    </div>
  </div>
  <div class="w-full">
    <h1 class="text-xl font-bold">{{.Character.Name}}</h1>

    <div class="badge badge-outline my-1 p-2">Lv. {{.Character.Level.Name}}</div>
    <div class="badge badge-accent badge-outline my-1 p-2">{{.Character.Class}}</div>
    <br />
    <div class="badge badge-primary badge-outline my-1 p-2">
      <img src="/assets/img/premium.png" class="h-4" />
      <span>{{.Character.Diamonds}}</span>
    </div>

    <div class="badge badge-warning badge-outline my-1 p-2">
      <img src="/assets/img/gold.png" class="h-4" />
      <span>{{.Character.Gold}}</span>
    </div>

    <progress class="progress progress-error w-full" value="{{.Character.Health}}" max="{{.Character.MaxHealth}}"></progress>
  </div>
</div>
{{end}}
