{{block "action-button" .}}
{{if .Working}}
<div class="btn btn-outline btn-primary mx-2 opacity-70">
  <img src="{{.Character.ActiveItem.Image}}" class="h-7 mx-1" />
  <span>{{.WorkingSeconds}}s…</span>
  <span class="loading loading-bars loading-sm"></span>
</div>
{{else}}
<div class="btn btn-outline btn-primary mx-2" hx-indicator=".running-action" hx-trigger="click" hx-swap="none" hx-post="/game/action/{{.Character.ActiveItem.ID}}">
  <img src="{{.Character.ActiveItem.Image}}" class="h-7 mx-1" />
  <span>{{.Character.ActiveItem.Name}}</span>
  <span class="loading loading-bars loading-sm htmx-indicator running-action"></span>
</div>
{{end}}
{{end}}
