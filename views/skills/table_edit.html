{{block "table-edit" .}}
<h3 class="text-lg font-bold">
  {{if .Page.Name}} Edit {{else}} Create {{end}} Skill
</h3>
<div>
  <form method="dialog" hx-swap="none" hx-post="/skills">
    <input type="hidden" name="ID" value="{{.Page.ID}}" />
    <input type="hidden" name="Runtime" value="0" />

    <label class="input flex items-center gap-2 mb-5 mt-5">
      <input
        type="text"
        class="grow"
        placeholder="Name"
        name="Name"
        value="{{.Page.Name}}"
      />
    </label>
  <div class="flex">
      <div class="avatar">
        <div class="h-20 w-20 rounded">
          {{if .Page.Image}}
          <img src="{{.Page.Image}}" />
          {{else}}
          <img src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.jpg" />
          {{end}}
        </div>
      </div>
      <label class="flex gap-2 items-center ml-5 mt-5 mb-5 w-full input">
        <div class="label">
          <span>Image Url</span>
        </div>

        <input type="text" class="grow" placeholder="Image Url" name="Image" value="{{.Page.Image}}" />
      </label>
    </div>
    <div class="modal-action">
      <button class="btn btn-primary mr-2">Save</button>
    </div>
  </form>
</div>
{{end}}
