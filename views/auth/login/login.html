{{template "auth_layout" .}} {{define "auth_content"}}

<div class="hero bg-default min-h-screen">
  <div class="hero-content flex-col top-0 absolute">
    <img src="/assets/img/favicon.png" class="w-4/12 mx-auto my-2" />
    <div class="text-center">
      <h1 class="text-5xl font-bold">Login</h1>
    </div>
    <div class="card bg-neutral text-neutral-content shadow-xl w-full max-w-sm shrink-0">
      <form class="card-body" hx-post="/login">
        <div class="flex-col">
          <label class="label">
            <span>Email</span>
          </label>
          <input type="email" name="Email" placeholder="Email" class="input" required />
        </div>
        <div class="flex-col">
          <label class="label">
            <span>Password</span>
          </label>
          <input
            type="password"
            name="Password"
            id="Password"
            placeholder="Password"
            class="input"
            required
          />
        </div>
        <div class="flex-col mt-6">
          <button class="btn btn-primary">Login</button>
          <a class="btn my-2" href="/register">Register</a>
        </div>
      </form>
    </div>
  </div>
</div>
{{end}}
