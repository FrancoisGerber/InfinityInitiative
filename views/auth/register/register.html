{{template "auth_layout" .}} {{define "auth_content"}}

<div class="hero bg-default min-h-screen">
  <div class="hero-content flex-col top-0 absolute">
    <img src="/assets/img/favicon.png" class="w-4/12 mx-auto my-2" />
    <div class="text-center">
      <h1 class="text-5xl font-bold">Register</h1>
    </div>
    <div class="card bg-neutral text-neutral-content shadow-xl w-full max-w-sm shrink-0">
      <form class="card-body" hx-post="/register">
        <div class="flex-col">
          <label class="label">
            <span>Email</span>
          </label>
          <input type="email" name="Email" placeholder="Email" class="input" required />
        </div>
        <div class="flex-col">
          <label class="label">
            <span>Username</span>
          </label>
          <input type="text" name="Username" placeholder="Username" class="input" required />
        </div>

        <div class="flex-col">
          <label class="label">
            <span>Character Name</span>
          </label>
          <input
            type="text"
            name="CharacterName"
            placeholder="Character Name"
            class="input"
            minlength="3"
            maxlength="24"
            required
          />
        </div>
        <div class="flex-col">
          <label class="label">
            <span>Class</span>
          </label>
          <select name="Class" class="select">
            {{range .DropdownData.Classes}}
            <option value="{{.}}">{{.}}</option>
            {{end}}
          </select>
        </div>
        <div class="flex-col">
          <label class="label">
            <span>Password</span>
          </label>
          <input
            type="password"
            name="Password"
            id="Password"
            placeholder="Password"
            class="input"
            required
          />
        </div>
        <div class="flex-col">
          <label class="label">
            <span>Verify Password</span>
          </label>
          <input
            type="password"
            name="VerifyPassword"
            id="VerifyPassword"
            placeholder="Verify Password"
            class="input"
            required
            onchange="check()"
          />
        </div>
        <div class="flex-col mt-6">
          <button class="btn btn-primary">Register</button>
          <a class="btn my-2" href="/login">Login</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function check() {
    var input = document.getElementById("VerifyPassword");
    if (input.value != document.getElementById("Password").value) {
      input.setCustomValidity("Password Must be the same.");
    } else {
      // input is valid -- reset the error message
      input.setCustomValidity("");
    }
  }
</script>
{{end}}
