{{block "table-edit" .}}
<h3 class="text-lg font-bold">
  {{if .Page.Username}} Edit {{else}} Create {{end}} User
</h3>
<div>
  <form method="dialog" hx-post="/users">
    <input type="hidden" name="ID" value="{{.Page.ID}}" />
    <input type="hidden" name="Image" value="{{.Page.Image}}" />

    <label class="input input-bordered flex items-center gap-2 mb-5 mt-5">
      <input
        type="text"
        class="grow"
        placeholder="Username"
        name="Username"
        value="{{.Page.Username}}"
      />
    </label>
    <label class="input input-bordered flex items-center gap-2 mb-5 mt-5">
      <input
        type="text"
        class="grow"
        placeholder="Email"
        name="Email"
        value="{{.Page.Email}}"
      />
    </label>
    <label class="input input-bordered flex items-center gap-2 mb-5 mt-5">
      <input
        type="password"
        class="grow"
        placeholder="Password"
        name="Password"
        value="{{.Page.Password}}"
      />
    </label>
    <div class="modal-action">
      <button class="btn btn-primary mr-2">Save</button>
    </div>
  </form>
</div>
{{end}}
