{{block "table-delete" .}}
<h3 class="text-lg font-bold">Are you sure?</h3>
<p class="py-4">
  Confirm that you are sure you want to delete {{.Page.Username}}.
</p>
<div class="modal-action">
  <form method="dialog">
    <button
      class="btn btn-error mr-2"
      hx-delete="/users/{{.Page.ID}}"
      hx-trigger="click"
    >
      Yes
    </button>
    <button class="btn btn-primary">No</button>
  </form>
</div>
{{end}}
